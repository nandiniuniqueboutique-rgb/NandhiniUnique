<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Placed — Nandini Unique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header id="site-header" class="site-header"></header>

<main class="container section">
  <div class="card center" style="max-width:560px; margin:0 auto; padding:44px 32px;">
    <div style="font-size:3rem">🎉</div>
    <h2>Thank you for your order!</h2>
    <p class="muted" id="order-id-line">Placing your order…</p>
    <p class="muted">We'll update you as your saree is packed and shipped — via email and WhatsApp.</p>
    <div class="row" style="justify-content:center; margin-top:20px">
      <a href="my-orders.html" class="btn btn-primary">View My Orders</a>
      <a href="shop.html" class="btn btn-outline">Continue Shopping</a>
    </div>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  renderHeader("shop");
  renderFooter();
  renderWaFloat();
  const id = new URLSearchParams(window.location.search).get("id");
  if (id) qs("#order-id-line").textContent = `Order reference: #${id.slice(-6).toUpperCase()}`;
</script>
</body>
</html>
