<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — Nandini Unique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header id="site-header" class="site-header"></header>

<main class="container section">
  <form id="register-form" class="form-card">
    <h2 class="center" style="margin-bottom:20px">Create Your Account</h2>
    <div class="field"><label>Full Name</label><input required name="name" /></div>
    <div class="field"><label>Email</label><input required type="email" name="email" /></div>
    <div class="field"><label>Phone Number</label><input required name="phone" placeholder="10-digit mobile number" /></div>
    <div class="field"><label>Password</label><input required type="password" name="password" minlength="6" /></div>
    <p id="reg-error" class="error-msg"></p>
    <button class="btn btn-primary btn-block" type="submit">Create Account</button>
    <p class="hint center" style="margin-top:14px">Already have an account? <a href="login.html" style="text-decoration:underline">Log in</a></p>
  </form>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
  renderHeader("");
  renderFooter();
  renderWaFloat();

  qs("#register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    qs("#reg-error").textContent = "";
    const fd = new FormData(e.target);
    try {
      const { token, user } = await api("/auth/register", {
        method: "POST", auth: false,
        body: Object.fromEntries(fd.entries()),
      });
      saveSession(token, user);
      window.location.href = "index.html";
    } catch (err) {
      qs("#reg-error").textContent = err.message;
    }
  });
</script>
</body>
</html>
